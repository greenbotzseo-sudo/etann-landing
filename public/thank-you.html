<!doctype html>
<html lang="en-SG">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Thank you | ETANN Academy</title>
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#fff;color:#000D63;font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;text-align:center;padding:24px;box-sizing:border-box}
  h1{font-size:22px;margin:0 0 8px}p{margin:0;color:#4a5170;max-width:420px}
</style>
</head>
<body>
<main>
  <h1>Thank you, we've received your enquiry</h1>
  <p>Our team will contact you on WhatsApp, usually within 1 business day, to confirm your course and funding.</p>
</main>
<script>
/* SPlus can redirect its form here after a successful submit. Inside the landing page's iframe this tells the
   page a lead was submitted (generate_lead). Opened on its own, it simply shows the message above. */
(function(){
  if (window.parent === window) return;
  try { var q = new URLSearchParams(location.search).get('situation');
  window.parent.postMessage({ source: 'etann-thank-you', type: 'form_success', situation: q || undefined }, location.origin); } catch (e) {}
})();
</script>
</body>
</html>
